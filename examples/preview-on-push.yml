# Copy to .github/workflows/ in your repository.
name: render preview
on:
  push:
    paths: ["scenes/**"]
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JasmyLab-JANCTION/render-janction@v1
        id: render
        with:
          api-key: ${{ secrets.JANCTION_RENDER_API_KEY }}
          scene-file: scenes/product.blend
          kind: preview
          frames: "1-24"
          max-cost-yen: 0
      - uses: actions/upload-artifact@v4
        with:
          name: render-preview
          path: render-output
